name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a new push supersedes one already in flight.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # vitest runs under Node, not bun, and build-content.test.ts needs
      # node:sqlite (unflagged in Node 22.13+). Unpinned, it got whatever
      # Node the runner image shipped.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      # ADR-0030: a high or critical advisory in the tree stops the deploy.
      # Ignored, each by GHSA, none of it shipped in dist/:
      # - seroval (GHSA-p6vx-979v-rg4c, GHSA-jp82-f5mq-hwhp) is Solid's server
      #   serializer and is not in the client bundle; drop when solid-js moves
      #   to seroval >=1.6.3. scripts/csp.test.ts asserts it stays out of dist/.
      # - braces (GHSA-vfj7-8cjw-p6xm), via markdownlint-cli2 > globby >
      #   fast-glob > micromatch: dev-only, not shipped; no published fix.
      - run: >-
          bun audit --audit-level=high
          --ignore=GHSA-p6vx-979v-rg4c
          --ignore=GHSA-jp82-f5mq-hwhp
          --ignore=GHSA-vfj7-8cjw-p6xm
      - run: bun run check
      - run: bun run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Board #52: the built app on three engines (Chromium, Firefox, WebKit) at a
  # phone and a desktop size. A broken engine stops the deploy. The webServer in
  # playwright.config.ts builds the app and serves it with `vite preview`.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  deploy:
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
